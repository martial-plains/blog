name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A post with a future #+DATE: only goes live on the first build on or after its
  # date.
  schedule:
    - cron: "5 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer run replaces one that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # For a project site at user.github.io/REPO use /REPO.
      # For a user site (user.github.io) or a custom domain, use an empty string.
      BLOG_BASE: ""
      # Scheme + host of the site, used for the absolute URLs in rss.xml.
      # For a custom domain use e.g. https://example.com instead.
      BLOG_ORIGIN: https://blog.isaiah-harvey.com
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: 29.4
      - name: Build
        run: emacs --batch -l publish.el -f blog-publish
      - name: Check internal links
        run: python3 scripts/check-links.py public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
