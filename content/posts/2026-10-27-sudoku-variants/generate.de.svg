<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 507" width="1200" height="507" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Ein Rätsel mit genau einer Lösung erzeugen</title><rect width="1200" height="507" rx="20" fill="#2b2b2e"/><text x="40" y="70" font-size="30" font-weight="700" fill="#fff">Ein Rätsel mit genau einer Lösung erzeugen</text><text x="40" y="106" font-size="19" font-weight="400" fill="#9ea8c7">Dasselbe Rezept für jede Variante. Nur der Regelsatz, gegen den der Solver prüft, ändert sich.</text><svg width="1140" height="350" viewBox="0 0 1140 350" x="40" y="117"><rect x="10" y="40" width="230" height="86" rx="14" fill="#3d3d45" stroke="#9ea8c7" stroke-width="2"/><text x="125" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Komplette Lösung</text><text x="125" y="103" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="middle">gültig unter allen Regeln</text><rect x="300" y="40" width="230" height="86" rx="14" fill="#3d3d45" stroke="#9ea8c7" stroke-width="2"/><text x="415" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Vorgabe entfernen</text><text x="415" y="103" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="middle">ein gefülltes Feld wählen</text><rect x="590" y="40" width="250" height="86" rx="14" fill="#3d3d45" stroke="#9ea8c7" stroke-width="2"/><text x="715" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Rest lösen</text><text x="715" y="103" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="middle">Lösungen zählen</text><line x1="240" y1="83" x2="300" y2="83" stroke="#9ea8c7" stroke-width="2.5"/><path d="M300 83 L290.9955289764732 87.3496553411123 L290.9955289764732 78.6503446588877 Z" fill="#9ea8c7"/><line x1="530" y1="83" x2="590" y2="83" stroke="#9ea8c7" stroke-width="2.5"/><path d="M590 83 L580.9955289764732 87.3496553411123 L580.9955289764732 78.6503446588877 Z" fill="#9ea8c7"/><rect x="900" y="10" width="210" height="70" rx="14" fill="#3d3d45" stroke="#22c55e" stroke-width="2"/><text x="1005" y="41" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Genau eine</text><text x="1005" y="65" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="middle">Entfernung behalten</text><rect x="900" y="100" width="210" height="70" rx="14" fill="#3d3d45" stroke="#fb7185" stroke-width="2"/><text x="1005" y="131" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Mehr als eine</text><text x="1005" y="155" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="middle">Vorgabe zurücksetzen</text><line x1="840" y1="70" x2="900" y2="45" stroke="#22c55e" stroke-width="2.5"/><path d="M900 45 L893.3611249556338 52.478324554690886 L890.0152362317014 44.44819161725279 Z" fill="#22c55e"/><line x1="840" y1="100" x2="900" y2="135" stroke="#fb7185" stroke-width="2.5"/><path d="M900 135 L890.0304626187237 134.22004846090664 L894.4137932135288 126.70576744124067 Z" fill="#fb7185"/><path d="M1110 45 H1128 V190 H415 V134 M1110 135 H1128" fill="none" stroke="#9ea8c7" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M415 126 L410.65 135 L419.35 135 Z" fill="#9ea8c7"/><text x="775" y="181" font-size="15" font-weight="600" fill="#9ea8c7" text-anchor="middle">nächste Vorgabe</text><circle cx="18" cy="257" r="7" fill="#22d3ee"/><text x="36" y="262" font-size="18" font-weight="700" fill="#fff" text-anchor="start">X-Sudoku</text><text x="146" y="262" font-size="16" font-weight="500" fill="#9ea8c7" text-anchor="start">Diagonalen kommen in die Regelliste</text><circle cx="598" cy="257" r="7" fill="#fbbf24"/><text x="616" y="262" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Killer</text><text x="726" y="262" font-size="16" font-weight="500" fill="#9ea8c7" text-anchor="start">Käfige wachsen lassen, Summen ablesen</text><circle cx="18" cy="305" r="7" fill="#8a93b2"/><text x="36" y="310" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Thermo</text><text x="146" y="310" font-size="16" font-weight="500" fill="#9ea8c7" text-anchor="start">Thermometer zuerst über die Lösung legen</text><circle cx="598" cy="305" r="7" fill="#8b5cf6"/><text x="616" y="310" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Jigsaw</text><text x="726" y="310" font-size="16" font-weight="500" fill="#9ea8c7" text-anchor="start">erst Bereiche schneiden, dann füllen</text><text x="10" y="222" font-size="15" font-weight="600" fill="#9ea8c7" text-anchor="start" letter-spacing=".08em">Wie jede Variante das Rezept abwandelt</text></svg></svg>