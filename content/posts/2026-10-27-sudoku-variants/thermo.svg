<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 465" width="1200" height="465" role="img"><title>Thermo: every position has a range</title><rect width="1200" height="465" rx="20" fill="#2b2b2e"/><text x="40" y="70" font-size="30" font-weight="700" fill="#fff">Thermo: every position has a range</text><text x="40" y="106" font-size="19" font-weight="400" fill="#9ea8c7">On a thermometer of n cells, position p (from 0 at the bulb) can only hold digits from p+1 to 9 − (n−1−p).</text><svg width="1120" height="310" viewBox="0 0 1120 310" x="40" y="115"><rect x="0" y="0" width="1" height="1" fill="none"/><line x1="155" y1="112" x2="1013" y2="112" stroke="#8a93b2" stroke-opacity="0.85" stroke-width="30" stroke-linecap="round"/><circle cx="155" cy="112" r="38" fill="#8a93b2" fill-opacity="0.9"/><text x="155" y="56" font-size="16" font-weight="500" fill="#9ea8c7" text-anchor="middle">bulb</text><text x="965" y="56" font-size="16" font-weight="500" fill="#9ea8c7" text-anchor="middle">tip</text><text x="155" y="120" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">p = 0</text><rect x="33.5" y="184" width="25" height="30" rx="5" fill="#22d3ee" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1.2"/><text x="46" y="205" font-size="15" font-weight="700" fill="#101330" text-anchor="middle">1</text><rect x="60.5" y="184" width="25" height="30" rx="5" fill="#22d3ee" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1.2"/><text x="73" y="205" font-size="15" font-weight="700" fill="#101330" text-anchor="middle">2</text><rect x="87.5" y="184" width="25" height="30" rx="5" fill="#22d3ee" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1.2"/><text x="100" y="205" font-size="15" font-weight="700" fill="#101330" text-anchor="middle">3</text><rect x="114.5" y="184" width="25" height="30" rx="5" fill="#22d3ee" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1.2"/><text x="