<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="sv" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 465" width="1200" height="465" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Killer: gallring av en halvfylld bur</title><rect width="1200" height="465" rx="20" fill="#2b2b2e"/><text x="40" y="70" font-size="30" font-weight="700" fill="#fff">Killer: gallring av en halvfylld bur</text><text x="40" y="106" font-size="19" font-weight="400" fill="#9ea8c7">En bur med tre rutor ska summera till 17 och innehåller redan en 8:a. Vad kan de andra två rutorna vara?</text><svg width="1120" height="310" viewBox="0 0 1120 310" x="40" y="115"><rect x="10" y="60" width="252" height="84" rx="10" fill="#fff7e0"/><line x1="94" y1="60" x2="94" y2="144" stroke="#c9b98a" stroke-width="1.5"/><line x1="178" y1="60" x2="178" y2="144" stroke="#c9b98a" stroke-width="1.5"/><rect x="15" y="65" width="242" height="74" rx="8" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="8 6"/><text x="52" y="116" font-size="46" font-weight="700" fill="#101330" text-anchor="middle">8</text><text x="136" y="116" font-size="46" font-weight="700" fill="#8a93b2" text-anchor="middle">?</text><text x="220" y="116" font-size="46" font-weight="700" fill="#8a93b2" text-anchor="middle">?</text><text x="10" y="42" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="start">Bursumma = 17</text><text x="10" y="178" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">17 − 8 = 9 återstår för två olika siffror,</text><text x="10" y="202" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">och ingen av dem kan vara 8.</text><text x="10" y="234" font-size="17" font-weight="600" fill="#fff" text-anchor="start">Par som fungerar: 2+7, 3+6, 4+5.</text><text x="560" y="34" font-size="18" font-weight="600" fill="#fff" text-anchor="start">Pröva varje kandidat för det första ”?”</text><rect x="560" y="60" width="44" height="38" rx="8" fill="#fb7185" fill-opacity="0.9"/><text x="582" y="87" font-size="22" font-weight="800" fill="#101330" text-anchor="middle">1</text><text x="624" y="86" font-size="18" font-weight="600" fill="#fff" text-anchor="start">kvar 8</text><text x="730" y="86" font-size="17" font-weight="500" fill="#fda4af" text-anchor="start">8 finns redan i buren: bort</text><rect x="560" y="110" width="44" height="38" rx="8" fill="#22c55e" fill-opacity="0.9"/><text x="582" y="137" font-size="22" font-weight="800" fill="#101330" text-anchor="middle">2</text><text x="624" y="136" font-size="18" font-weight="600" fill="#fff" text-anchor="start">kvar 7</text><text x="730" y="136" font-size="17" font-weight="500" fill="#86efac" text-anchor="start">7 är ledig: passar</text><rect x="560" y="160" width="44" height="38" rx="8" fill="#22c55e" fill-opacity="0.9"/><text x="582" y="187" font-size="22" font-weight="800" fill="#101330" text-anchor="middle">4</text><text x="624" y="186" font-size="18" font-weight="600" fill="#fff" text-anchor="start">kvar 5</text><text x="730" y="186" font-size="17" font-weight="500" fill="#86efac" text-anchor="start">5 är ledig: passar</text><rect x="560" y="210" width="44" height="38" rx="8" fill="#fb7185" fill-opacity="0.9"/><text x="582" y="237" font-size="22" font-weight="800" fill="#101330" text-anchor="middle">9</text><text x="624" y="236" font-size="18" font-weight="600" fill="#fff" text-anchor="start">kvar 0</text><text x="730" y="236" font-size="17" font-weight="500" fill="#fda4af" text-anchor="start">kräver en siffra ≥ 1: bort</text><text x="560" y="272" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="start">Bara ett gallringstest. En summa inom intervallet kan</text><text x="560" y="292" font-size="15" font-weight="500" fill="#9ea8c7" text-anchor="start">ändå vara omöjlig när andra regler kommer med.</text></svg></svg>