<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="is" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 520" width="1200" height="520" role="img"><title>Rétthyrningur sem er það ekki</title><rect width="1200" height="520" rx="20" fill="#2b2b2e"/><text x="40" y="70" font-size="30" font-weight="700" fill="#fff">Rétthyrningur sem er það ekki</text><text x="40" y="106" font-size="19" font-weight="400" fill="#9ea8c7">Gamli kóðinn beitti Unique Rectangle hér. Aðeins einn af reitunum fjórum hefur nákvæmlega tvo möguleika.</text><rect x="60" y="150" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#22d3ee" stroke-width="4"/><text x="74" y="176" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r1c2</text><text x="138.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="172.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><rect x="266" y="150" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#c9ccdd" stroke-width="1.5"/><text x="280" y="176" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r1c5</text><text x="327.0" y="238" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">1</text><text x="361.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="395.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><rect x="60" y="296" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#c9ccdd" stroke-width="1.5"/><text x="74" y="322" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r2c2</text><text x="121.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="155.0" y="384" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">5</text><text x="189.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><rect x="266" y="296" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#c9ccdd" stroke-width="1.5"/><text x="280" y="322" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r2c5</text><text x="327.0" y="384" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">1</text><text x="361.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="395.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><text x="512" y="166" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Hvað Unique Rectangle þarf</text><text x="512" y="200" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">Fjórir reitir í tveimur röðum, tveimur dálkum og</text><text x="512" y="224" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">tveimur kössum þar sem skipta mætti tölustöfunum</text><text x="512" y="248" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">2 og 6 frjálst. Þraut með eina lausn leyfir það ekki.</text><text x="512" y="294" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Hvað kóðinn athugaði</text><text x="512" y="328" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">Að tveir reitir deildu tölustöfunum 2 og 6 og að hinir</text><text x="512" y="352" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">tveir hefðu þá auk einnar aukatölu. Hann spurði aldrei</text><text x="512" y="376" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">hvort fyrri tveir hefðu ekkert annað.</text><text x="512" y="422" font-size="17" font-weight="500" fill="#fbbf24" text-anchor="start">Hér bera þrír reitir aukamöguleika (appelsínugult), svo</text><text x="512" y="446" font-size="17" font-weight="500" fill="#fbbf24" text-anchor="start">skiptin eru ekki banvæn og ályktunin var röng.</text></svg>