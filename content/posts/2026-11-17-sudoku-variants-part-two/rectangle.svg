<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 520" width="1200" height="520" role="img"><title>A rectangle that isn’t one</title><rect width="1200" height="520" rx="20" fill="#2b2b2e"/><text x="40" y="70" font-size="30" font-weight="700" fill="#fff">A rectangle that isn’t one</text><text x="40" y="106" font-size="19" font-weight="400" fill="#9ea8c7">The old code fired a Unique Rectangle on this. Only one of the four cells holds exactly two candidates.</text><rect x="60" y="150" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#22d3ee" stroke-width="4"/><text x="74" y="176" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r1c2</text><text x="138.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="172.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><rect x="266" y="150" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#c9ccdd" stroke-width="1.5"/><text x="280" y="176" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r1c5</text><text x="327.0" y="238" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">1</text><text x="361.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="395.0" y="238" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><rect x="60" y="296" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#c9ccdd" stroke-width="1.5"/><text x="74" y="322" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r2c2</text><text x="121.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="155.0" y="384" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">5</text><text x="189.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><rect x="266" y="296" width="190" height="130" rx="12" fill="#f4f6ff" stroke="#c9ccdd" stroke-width="1.5"/><text x="280" y="322" font-size="15" font-weight="600" fill="#6b7390" text-anchor="start">r2c5</text><text x="327.0" y="384" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">1</text><text x="361.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">2</text><text x="395.0" y="384" font-size="38" font-weight="700" fill="#101330" text-anchor="middle">6</text><text x="512" y="166" font-size="20" font-weight="700" fill="#fff" text-anchor="start">What a Unique Rectangle needs</text><text x="512" y="200" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">Four cells in two rows, two columns and two boxes,</text><text x="512" y="224" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">where the digits 2 and 6 could be swapped freely.</text><text x="512" y="248" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">A puzzle with one solution can't allow that swap.</text><text x="512" y="294" font-size="20" font-weight="700" fill="#fff" text-anchor="start">What the code checked</text><text x="512" y="328" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">That two cells shared the digits 2 and 6, and that</text><text x="512" y="352" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">the other two held them plus one extra. It never</text><text x="512" y="376" font-size="17" font-weight="500" fill="#9ea8c7" text-anchor="start">asked whether the first two held nothing else.</text><text x="512" y="422" font-size="17" font-weight="500" fill="#fbbf24" text-anchor="start">Here three cells carry extras (amber), so the</text><text x="512" y="446" font-size="17" font-weight="500" fill="#fbbf24" text-anchor="start">swap isn't deadly, and the deduction was unsound.</text></svg>